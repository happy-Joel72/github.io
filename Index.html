<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>조수경 | 경기대학교 겸임교수</title>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
      background: linear-gradient(145deg, #f5f0fa, #e8e0f3);
      color: #302640;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .card {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 28px;
      padding: 40px 28px;
      box-shadow: 0 15px 45px rgba(85, 55, 120, 0.15);
      text-align: center;
    }

    .badge {
      display: inline-block;
      background: #eee5f7;
      color: #754b99;
      padding: 9px 18px;
      border-radius: 30px;
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 25px;
    }

    h1 {
      font-size: 42px;
      font-weight: 800;
      color: #553477;
      margin-bottom: 10px;
    }

    .english {
      font-size: 17px;
      letter-spacing: 3px;
      color: #9985aa;
      margin-bottom: 20px;
    }

    .position {
      font-size: 23px;
      font-weight: 700;
      margin-bottom: 12px;
    }

    .intro {
      font-size: 17px;
      color: #777;
      line-height: 1.8;
    }

    .divider {
      width: 55px;
      height: 4px;
      background: #a780c5;
      border-radius: 10px;
      margin: 32px auto;
    }

    h2 {
      font-size: 22px;
      color: #553477;
      margin-bottom: 23px;
    }

    .service {
      background: #f8f5fc;
      border: 1px solid #eee5f5;
      border-radius: 17px;
      padding: 22px 15px;
      margin-bottom: 15px;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .icon {
      font-size: 30px;
      min-width: 42px;
      text-align: center;
    }

    .service-title {
      font-size: 19px;
      font-weight: 700;
      color: #49315f;
      line-height: 1.5;
    }

    .service-desc {
      font-size: 14px;
      color: #888;
      margin-top: 5px;
      line-height: 1.5;
    }

    .contact {
      margin-top: 35px;
    }

    button {
      width: 100%;
      padding: 20px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #7950a0, #a37ac3);
      color: white;
      font-size: 22px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 7px 18px rgba(121, 80, 160, 0.25);
      transition: 0.2s;
    }

    button:active {
      transform: scale(0.97);
    }

    footer {
      margin-top: 28px;
      font-size: 13px;
      color: #aaa;
      line-height: 1.7;
    }

    @media (max-width: 360px) {
      .card { padding: 30px 20px; }
      h1 { font-size: 36px; }
      .service-title { font-size: 17px; }
    }
  </style>
</head>

<body>

  <main class="card">

    <header>
      <div class="badge">KYONGGI UNIVERSITY</div>

      <h1>조수경</h1>
      <p class="english">CHO SU KYUNG</p>

      <p class="position">경기대학교 겸임교수</p>

      <p class="intro">
        경영학 박사<br>
        서비스경영 · 학술연구 · 창업컨설팅<br>
        지식과 경험을 연결하여<br>
        새로운 가치를 창출합니다.
      </p>
    </header>

    <div class="divider"></div>

    <section>
      <h2>전문 활동 분야</h2>

      <div class="service">
        <div class="icon">🎓</div>
        <div>
          <div class="service-title">
            서비스경영전문대학원 강의
          </div>
          <div class="service-desc">
            서비스경영 및 경영학 전문교육
          </div>
        </div>
      </div>

      <div class="service">
        <div class="icon">📚</div>
        <div>
          <div class="service-title">
            석·박사 논문지도
          </div>
          <div class="service-desc">
            연구설계 · 연구방법론 · 학위논문 지도
          </div>
        </div>
      </div>

      <div class="service">
        <div class="icon">💡</div>
        <div>
          <div class="service-title">
            창업 지도 및 컨설팅
          </div>
          <div class="service-desc">
            창업전략 · 사업계획 · 정부지원사업
          </div>
        </div>
      </div>
    </section>

    <section class="contact">
      <button onclick="contactProfessor()">
        ✉️ 문의하기
      </button>
    </section>

    <footer>
      조수경 Ph.D.<br>
      Adjunct Professor · Kyonggi University<br>
      © 2026 CHO SU KYUNG
    </footer>

  </main>

  <script>
    function contactProfessor() {
      const email = prompt(
        "문의하실 내용을 이메일로 보내시겠습니까?\n\n받는 사람의 이메일 주소를 입력하세요."
      );

      if (email && email.trim()) {
        const subject = encodeURIComponent(
          "조수경 교수님께 문의드립니다"
        );

        const body = encodeURIComponent(
          "안녕하세요, 교수님.\n\n문의 내용:\n\n"
        );

        window.location.href =
          `mailto:${email.trim()}?subject=${subject}&body=${body}`;
      }
    }
  </script>

</body>
</html>
